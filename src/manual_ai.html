<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manual AI Test Harness</title>
</head>
<body>
  <h1>Manual AI Test Harness</h1>

  <label for="client-text">Текст клиента</label><br>
  <textarea id="client-text" rows="8" cols="80"></textarea><br>
  <button id="copy-prompt">Скопировать запрос для ChatGPT</button>

  <p>Скопируйте prompt в ChatGPT вручную. Затем вставьте только JSON-ответ:</p>
  <label for="ai-json">Ответ AI (JSON)</label><br>
  <textarea id="ai-json" rows="10" cols="80"></textarea><br>
  <button id="check-rule-engine">Проверить через Rule Engine</button>

  <h2>Результат</h2>
  <pre id="result"></pre>

  <script>
    const fields = [
      "affected_properties",
      "issue_type",
      "affected_bookings",
      "other_bookings_working",
      "overbooking_risk",
      "error_code",
      "problem_active",
      "next_checkin_hours",
      "claimed_urgency"
    ];

    function buildPrompt(clientText) {
      return `Extract only facts explicitly stated in the client message below.
Do not guess or invent facts. If the client did not provide a fact, return null.
Normalize explicit meaning into only these issue_type values: availability_sync, reservation_sync, suspected_duplicate_booking. Use a category only when the message clearly matches it; never choose a closest match. availability_sync means availability, inventory, or free-room data being updated or synchronized between systems/channels. Access to, viewing of, or a generic problem with a rate plan is not availability_sync; use null when no category clearly matches.
Set "problem_active" to true when the message explicitly describes a problem or inability in the present/current state, including wording such as "сейчас не работает", "сейчас не могу...", "прямо сейчас...", or "получаем ошибку сейчас". Do not require the word "ongoing" when present-tense wording clearly establishes that the problem is happening now. Set it to false only when the message explicitly says the problem was resolved, stopped, or is no longer observed; otherwise return null. A past event without a clear current-state signal remains null.
Set "next_checkin_hours" to 0 only if check-in/guest arrival is explicitly happening now, right now, or immediately. Normalize explicit "in N hours" to N. "Today" alone is not 0; otherwise return null.
An overbooking concern explicitly reported by the client may set "overbooking_risk" to true; this means reported risk, not independently verified risk.
Normalize explicitly claimed urgency to low, normal, or high; otherwise use null. Claimed urgency is not priority.
Do not choose route. Do not choose priority. Do not make a business decision.
Return only valid JSON, with no markdown fences and no explanation before or after it.
Use exactly these fields: ${fields.join(", ")}.
For example, do not set "other_bookings_working" to true unless the client explicitly said it.

Client message:
${clientText}`;
    }

    document.getElementById("copy-prompt").onclick = async () => {
      const prompt = buildPrompt(document.getElementById("client-text").value);
      await navigator.clipboard.writeText(prompt);
      document.getElementById("result").textContent = "Prompt скопирован.";
    };

    document.getElementById("check-rule-engine").onclick = async () => {
      const result = document.getElementById("result");
      let facts;
      try {
        facts = JSON.parse(document.getElementById("ai-json").value);
      } catch (error) {
        result.textContent = "Ошибка: ответ AI содержит невалидный JSON.";
        return;
      }

      try {
        const response = await fetch("/route", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(facts)
        });
        const decision = await response.json();
        result.textContent = JSON.stringify(decision, null, 2);
      } catch (error) {
        result.textContent = "Ошибка: не удалось обратиться к Rule Engine.";
      }
    };
  </script>
</body>
</html>
